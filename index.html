<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Movie-Jobazzle</title>

<style>
body{
margin:0;
font-family:Georgia, serif;
background:#ffeaf5;
background-size:cover;
background-position:center;
color:#4d2c3d;
}

.overlay{
min-height:100vh;
background:rgba(255,245,250,0.85);
padding:30px;
}

.container{
max-width:900px;
margin:auto;
background:white;
padding:25px;
border-radius:25px;
box-shadow:0 10px 30px rgba(0,0,0,.1);
}

h1{
text-align:center;
color:#d86ca7;
}

textarea{
width:100%;
height:180px;
border-radius:15px;
border:1px solid #ddd;
padding:10px;
font-size:15px;
}

button{
background:#e680b8;
color:white;
border:none;
padding:12px 18px;
border-radius:15px;
cursor:pointer;
font-size:16px;
margin-top:10px;
}

button:hover{
background:#d664a2;
}

.vs{
display:flex;
gap:20px;
margin-top:20px;
flex-wrap:wrap;
}

.card{
flex:1;
background:#fff8fc;
padding:15px;
border-radius:20px;
text-align:center;
}

.card img{
width:100%;
max-height:300px;
object-fit:cover;
border-radius:15px;
}

.result li{
margin:8px 0;
}

input[type=file]{
margin-top:10px;
}

.message{
font-style:italic;
text-align:center;
margin-top:15px;
color:#aa4e7f;
}
</style>
</head>
<body>

<div class="overlay">
<div class="container">

<h1>🎬 Movie-Jobazzle 🎀</h1>

<p>Paste your movies (one per line).</p>

<textarea id="movies"></textarea>

<br>

<label><b>Background Image:</b></label><br>
<input type="file" id="bgUpload" accept="image/*">

<br><br>

<button onclick="startSort()">Start Sorting ✨</button>

<div id="game"></div>
<div id="results"></div>

</div>
</div>

<script>

let movies=[];
let i=0;
let j=1;

const messages=[
"This choice will haunt you forever.",
"Be honest.",
"Your future self is judging.",
"This one hurts.",
"Choose wisely."
];

document.getElementById("bgUpload").addEventListener("change", function(e){
const file=e.target.files[0];
if(!file) return;

const reader=new FileReader();

reader.onload=function(event){
document.body.style.backgroundImage=
`url('${event.target.result}')`;
}

reader.readAsDataURL(file);
});

function startSort(){

movies=document.getElementById("movies").value
.split("\n")
.map(x=>x.trim())
.filter(x=>x);

if(movies.length<2){
alert("Add at least 2 movies.");
return;
}

i=0;
j=1;

showPair();
}

function showPair(){

if(i>=movies.length-1){
showResults();
return;
}

if(j>=movies.length){
i++;
j=i+1;
showPair();
return;
}

document.getElementById("game").innerHTML=`
<h2>Which do you prefer?</h2>

<div class="vs">

<div class="card">
<h3>${movies[i]}</h3>
<button onclick="pickA()">Choose</button>
</div>

<div class="card">
<h3>${movies[j]}</h3>
<button onclick="pickB()">Choose</button>
</div>

</div>

<div class="message">
${messages[Math.floor(Math.random()*messages.length)]}
</div>
`;
}

function pickA(){
j++;
showPair();
}

function pickB(){

let temp=movies[i];
movies[i]=movies[j];
movies[j]=temp;

j++;
showPair();
}

function showResults(){

let html="<h2>🏆 Final Ranking</h2><ol class='result'>";

for(let movie of movies){
html+=`<li>${movie}</li>`;
}

html+="</ol>";

document.getElementById("game").innerHTML="";
document.getElementById("results").innerHTML=html;
}

</script>

</body>
</html>
